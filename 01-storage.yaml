apiVersion: v1
kind: PersistentVolume
metadata:
  name: hdfs-pv
spec:
  capacity:
    storage: 20Gi  # 👈 Increased from 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: /mnt/hdfs-data  # Matches Kind extraMounts containerPath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdfs-storage
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi  # 👈 Must match or be smaller than the PV capacity