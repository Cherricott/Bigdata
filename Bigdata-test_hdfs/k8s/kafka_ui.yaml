apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: bigdata
spec:
  type: NodePort
  ports:
    - port: 8080
      nodePort: 30080   # accessible at http://localhost:30080
      name: web
  selector:
    app: kafka-ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "local"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.bigdata.svc.cluster.local:29092"
            - name: KAFKA_CLUSTERS_0_ZOOKEEPER
              value: "zookeeper.bigdata.svc.cluster.local:2181"
