# --- NAMENODE SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: namenode
spec:
  ports:
  - name: rpc
    port: 9000
    targetPort: 9000
  - name: http
    port: 9870
    targetPort: 9870
  selector:
    app: namenode
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-config
data:
  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>dfs.namenode.name.dir</name>
        <value>file:///hadoop/dfs/name</value>
      </property>
      <property>
        <name>dfs.datanode.data.dir</name>
        <value>file:///hadoop/dfs/data</value>
      </property>
      
      <property>
        <name>dfs.namenode.rpc-bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>dfs.namenode.servicerpc-bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>dfs.namenode.rpc-address</name>
        <value>namenode:9000</value>
      </property>

      <property>
        <name>dfs.namenode.datanode.registration.ip-hostname-check</name>
        <value>false</value>
      </property>
      <property>
        <name>dfs.datanode.use.datanode.hostname</name>
        <value>false</value>
      </property>
    </configuration>
---
# --- NAMENODE DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namenode
spec:
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /hadoop/dfs/name && chmod -R 777 /hadoop/dfs/name"]
        volumeMounts:
        - mountPath: /hadoop/dfs/name
          name: hdfs-disk
          subPath: namenode-metadata
      containers:
      - name: namenode
        image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
        env:
        - name: CLUSTER_NAME
          value: "test"
        - name: CORE_CONF_fs_defaultFS
          value: "hdfs://namenode:9000"
        volumeMounts:
        - mountPath: /hadoop/dfs/name
          name: hdfs-disk
          subPath: namenode-metadata
        - mountPath: /etc/hadoop/hdfs-site.xml 
          name: hdfs-conf-vol
          subPath: hdfs-site.xml
      volumes:
      - name: hdfs-disk
        persistentVolumeClaim:
          claimName: hdfs-storage
      - name: hdfs-conf-vol
        configMap:
          name: hdfs-config
---
# --- DATANODE DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanode
spec:
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /hadoop/dfs/data && chmod -R 777 /hadoop/dfs/data"]
        volumeMounts:
        - mountPath: /hadoop/dfs/data
          name: hdfs-disk
          subPath: datanode-data
      containers:
      - name: datanode
        image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
        env:
        - name: SERVICE_PRECONDITION
          value: "namenode:9870"
        - name: CORE_CONF_fs_defaultFS
          value: "hdfs://namenode:9000"
        volumeMounts:
        - mountPath: /hadoop/dfs/data
          name: hdfs-disk
          subPath: datanode-data
        - mountPath: /etc/hadoop/hdfs-site.xml
          name: hdfs-conf-vol
          subPath: hdfs-site.xml
      volumes:
      - name: hdfs-disk
        persistentVolumeClaim:
          claimName: hdfs-storage
      - name: hdfs-conf-vol
        configMap:
          name: hdfs-config
---
# --- ZOOKEEPER & KAFKA (Unchanged) ---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  ports:
  - port: 2181
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.6.0
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
  - name: external
    port: 9092
    targetPort: 9092
  - name: internal
    port: 29092
    targetPort: 29092
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.0
        command:
          - "sh"
          - "-c"
          - "unset KAFKA_PORT && /etc/confluent/docker/run"
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"